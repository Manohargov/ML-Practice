<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="ML-Practice — Machine Learning Practice Repository">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="45%" stop-color="#0A1B2A"/>
      <stop offset="100%" stop-color="#0B2A26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="55%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- decorative sparkline -->
  <g opacity="0.95">
    <path d="M820 250 L880 214 L930 228 L980 178 L1030 190 L1080 132 L1140 96 L1140 280 L820 280 Z" fill="url(#areaFill)"/>
    <path d="M820 250 L880 214 L930 228 L980 178 L1030 190 L1080 132 L1140 96" fill="none" stroke="url(#strokeGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
    <circle cx="1140" cy="96" r="7" fill="#A3E635" filter="url(#soft)"/>
    <circle cx="980" cy="178" r="5" fill="#2DD4BF" opacity="0.85"/>
    <circle cx="880" cy="214" r="4" fill="#22D3EE" opacity="0.7"/>
  </g>

  <!-- title -->
  <text x="72" y="132" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="1" fill="#F8FAFC">
    ML<tspan fill="#2DD4BF">·</tspan>Practice
  </text>
  <text x="74" y="172" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="500" fill="#94A3B8">
    A hands-on playground for regression, classification &amp; deep learning
  </text>

  <rect x="72" y="196" width="620" height="4" rx="2" fill="url(#accent)" opacity="0.9"/>

  <!-- chips -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">
    <g>
      <rect x="72" y="228" width="122" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#2DD4BF" stroke-opacity="0.45"/>
      <text x="133" y="250" text-anchor="middle">Regression</text>
    </g>
    <g>
      <rect x="206" y="228" width="146" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#4ADE80" stroke-opacity="0.45"/>
      <text x="279" y="250" text-anchor="middle">Classification</text>
    </g>
    <g>
      <rect x="364" y="228" width="118" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#A3E635" stroke-opacity="0.45"/>
      <text x="423" y="250" text-anchor="middle">Boosting</text>
    </g>
    <g>
      <rect x="494" y="228" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#F59E0B" stroke-opacity="0.45"/>
      <text x="569" y="250" text-anchor="middle">Deep Learning</text>
    </g>
    <g>
      <rect x="656" y="228" width="126" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.45"/>
      <text x="719" y="250" text-anchor="middle">EDA</text>
    </g>
  </g>

  <text x="72" y="296" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#64748B">
    Python • Jupyter • scikit-learn • TensorFlow • XGBoost • CatBoost • LightGBM
  </text>
</svg>
